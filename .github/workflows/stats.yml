name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically once every day at midnight
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab anytime

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SVG stats
        uses: action-pack/github-readme-stats@main
        with:
          username: Joelene241161
          show_icons: true
          theme: radial
          filename: stats.svg

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git commit -m "docs: update daily github stats" || exit 0
          git push
